apiVersion: v1
kind: Service
metadata:
  name: n8n-main
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: n8n-main
  ports:
    - port: 80
      targetPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: n8n-webhook
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: n8n-webhook
  ports:
    - port: 80
      targetPort: 5678